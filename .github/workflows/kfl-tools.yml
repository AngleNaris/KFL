name: KFL tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The reference pages must pass their own audits, so the kit cannot drift from the law.
      - run: npm run grid:audit -- --manifest grid/demo/demo.manifest.json --html grid/demo/index.html
      - run: |
          for page in index grid components settings; do
            npm run grid:audit -- --manifest ../examples/grid/kfl.manifest.json --html ../examples/$page.html
            npm run surface:audit -- --html ../examples/$page.html --viewports 375t,1440 --geometry square
          done
